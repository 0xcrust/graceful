[package]
name = "graceful"
version = "0.1.0"
edition = "2024"
description = "A parser for Solana swap transactions"
license = "MIT OR Apache-2.0"
repository = "https://github.com/0xcrust/graceful"
documentation = "https://docs.rs/graceful"

[dependencies]
agave-feature-set = "3.0.0"
#agave-reserved-account-keys = "3.0.0"
#agave-transaction-view = {version = "3.0.0", features = ["agave-unstable-api"]}
anchor-lang = "1.1.2"
base64 = "0.22.1"
bincode = "1.3.3"
borsh = "1.6.0"
bs58 = "0.5.1"
bytemuck = "1.25.0"
laserstream-core-proto = "9.0.2"
lazy_static = "1.5.0"

solana-account = "3.0.0"
solana-account-decoder = "3.0.0"
solana-address = "2.6.1"
#solana-address-lookup-table-interface = "3.0.0"
solana-bincode = "3.0.0"
solana-client = "3.0.0"
#solana-clock = "3.0.0"
#solana-commitment-config = "3.0.0"
#solana-compute-budget = "3.0.0"
#solana-compute-budget-instruction = {version = "3.0.0", features = ["agave-unstable-api"]}
#solana-compute-budget-interface = "3.0.0"
solana-hash = "3.0.0"
solana-log-parser = "0.2.0"
#solana-instruction = "3.0.0"
#solana-keypair = "3.0.0"
solana-message = "3.0.0"
#solana-metrics = "3.0.0"
#solana-perf = "3.0.0"
#solana-program = "3.0.0"
solana-program-error = "3.0.0"
#solana-program-pack = "3.0.0"
solana-pubkey = "3.0.0"
solana-sdk-ids = "3.1.0"
#solana-rpc-client-api = "3.0.0"
#solana-runtime = "3.0.0"
#solana-sdk = "3.0.0"
#solana-short-vec = "3.0.0"
solana-signature = "3.0.0"
#solana-storage-proto = "3.0.0"
#solana-svm-transaction = "3.0.0"
#solana-sysvar = "3.0.0"
solana-transaction = "3.0.0"
solana-transaction-context = "3.0.0"
solana-transaction-error = "3.0.0"
#solana-transaction-error = "3.0.0"
solana-transaction-status = {version = "3.0.0", features = ["agave-unstable-api"]}
solana-system-interface = {version = "3.0.0", features = ["bincode"]}
solana-vote-program = "3.0.0"
spl-token-2022-interface = "3.1.1"
spl-token-interface = "2.0.0"
thiserror = "2.0.18"
tokio = { version = "1.47.1", features = ["rt-multi-thread", "macros"] }
log = "0.4.33"
self_cell = "1.2.2"
once_cell = "1.21.4"
anyhow = "1.0.103"
serde = "1.0.228"

[dev-dependencies]
dotenv = "0.15.0"
