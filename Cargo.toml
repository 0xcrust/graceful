[workspace]
members = ["cli", "graced"]

[workspace.dependencies]
agave-feature-set = "3.0.0"
anchor-lang = "1.1.2"
anchor-spl = {version = "1.1.2", features = ["metadata"]}
anyhow = "1.0.103"
base64 = "0.22.1"
bincode = "1.3.3"
borsh = "1.6.0"
bs58 = "0.5.1"
bytemuck = "1.25.0"
laserstream-core-proto = "9.0.2"
lazy_static = "1.5.0"
log = "0.4.33"
once_cell = "1.21.4"
self_cell = "1.2.2"
serde = "1.0.228"
solana-account = "3.0.0"
solana-account-decoder = "3.0.0"
solana-address = "2.6.1"
solana-bincode = "3.0.0"
solana-client = "3.0.0"
solana-commitment-config = "3.0.0"
solana-hash = "3.0.0"
solana-log-parser = "0.2.0"
solana-message = "3.0.0"
solana-program-error = "3.0.0"
solana-program-pack = "3.0.0"
solana-pubkey = "3.0.0"
solana-sdk-ids = "3.1.0"
solana-signature = "3.0.0"
solana-transaction = "3.0.0"
solana-transaction-context = "3.0.0"
solana-transaction-error = "3.0.0"
solana-transaction-status = {version = "3.0.0", features = ["agave-unstable-api"]}
solana-system-interface = {version = "3.0.0", features = ["bincode"]}
solana-vote-program = "3.0.0"
spl-token-2022-interface = "2.1.0"
spl-token-interface = "2.0.0"
spl-token-metadata-interface = "0.8.0"
thiserror = "2.0.18"
tokio = { version = "1.47.1", features = ["rt-multi-thread", "macros"] }
