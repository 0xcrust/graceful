name: Release

# Triggers on tags like v0.1.0, v1.2.3, v1.2.3-beta.1, etc.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  BIN_NAME: cargo-graceful

jobs:
  # Re-run the same checks as CI before publishing
  verify:
    name: Verify before publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-features
      - name: Check tag matches graceful-cli version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CARGO_VERSION="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "graceful-cli") | .version')"
          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match graceful-cli version ($CARGO_VERSION)"
            exit 1
          fi

  build:
    name: Build (${{ matrix.target }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "27.2"

      - name: Point PROTOC at the installed binary
        shell: bash
        run: echo "PROTOC=$(command -v protoc)" >> "$GITHUB_ENV"

      - name: Install cross-compilation tools
        if: contains(matrix.target, 'musl') || contains(matrix.target, 'aarch64-unknown-linux')
        run: |
          cargo install cross --git https://github.com/cross-rs/cross --locked

      - name: Build (native)
        if: ${{ !contains(matrix.target, 'musl') && !contains(matrix.target, 'aarch64-unknown-linux') }}
        run: cargo build --release --locked -p graceful-cli --target ${{ matrix.target }}

      - name: Build (cross)
        if: contains(matrix.target, 'musl') || contains(matrix.target, 'aarch64-unknown-linux')
        run: cross build --release --locked -p graceful-cli --target ${{ matrix.target }}

      - name: Package (unix)
        if: "!contains(matrix.os, 'windows')"
        shell: bash
        run: |
          set -euo pipefail
          cd target/${{ matrix.target }}/release
          strip ${{ env.BIN_NAME }} || true
          tar -czf ${{ github.workspace }}/${{ env.BIN_NAME }}-${{ matrix.target }}.tar.gz ${{ env.BIN_NAME }}

      - name: Package (windows)
        if: contains(matrix.os, 'windows')
        shell: pwsh
        run: |
          Compress-Archive -Path target/${{ matrix.target }}/release/${{ env.BIN_NAME }}.exe `
            -DestinationPath ${{ env.BIN_NAME }}-${{ matrix.target }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BIN_NAME }}-${{ matrix.target }}
          path: |
            ${{ env.BIN_NAME }}-${{ matrix.target }}.tar.gz
            ${{ env.BIN_NAME }}-${{ matrix.target }}.zip
          if-no-files-found: ignore

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: sha256sum * > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  publish-crate:
    name: Publish to crates.io
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Dry-run first as a final sanity check (packaging errors, missing
      # license file, etc). `graceful` must publish before `graceful-cli`,
      # since the CLI depends on it with a version requirement.
      - name: Dry-run publish (graceful)
        run: cargo publish -p graceful --dry-run
      - name: Publish graceful
        run: cargo publish -p graceful --token ${{ secrets.CARGO_REGISTRY_TOKEN }}

      # Give crates.io's index a moment to catch up before the dependent
      # crate tries to resolve against it.
      - name: Wait for index
        run: sleep 20

      - name: Dry-run publish (graceful-cli)
        run: cargo publish -p graceful-cli --dry-run
      - name: Publish graceful-cli
        run: cargo publish -p graceful-cli --token ${{ secrets.CARGO_REGISTRY_TOKEN }}